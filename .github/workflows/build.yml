name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Сборка
        working-directory: MeetingApp
        run: swift build

      - name: Тесты логики
        working-directory: MeetingApp
        run: swift run MeetingAppTests

      # Только быстрые тесты: медленным нужны whisper-cli и модель на диске,
      # это гигабайты загрузки на каждый прогон. Их гоняем локально
      # (./scripts/tests/run_tests.sh --full) перед переносом в рабочую сборку.
      - name: Тесты скриптов
        working-directory: MeetingApp
        run: ./scripts/tests/run_tests.sh
